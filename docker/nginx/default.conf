server {
    listen 80;
    server_name localhost;

    # Root directory for the Symfony application
    root /app/public;
    index index.php;

    location / {
        # Try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    # Pass PHP scripts to the PHP-FPM service
    location ~ ^/index\.php(/|$) {
        # The 'php' hostname matches the service name in docker-compose.yml
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # When you are using symlinks to link the document root to the
        # real one, you must ensure that your host is properly configured
        # to avoid issues with linking plain files.
        # See https://github.com/Richtermeister/docker-symfony/issues/12
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Prevents URIs that include the front controller. This will 404:
        # http://domain.tld/index.php/some/path
        # Remove the internal directive to allow URIs like this
        internal;
    }

    # Return 404 for other php files not matching the front controller
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/symfony_error.log;
    access_log /var/log/nginx/symfony_access.log;
}
