version: '3.8'

services:
    # PHP-FPM Service
    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: symfony_php
        restart: unless-stopped
        volumes:
            # Mount the application code for live development
            - .:/app
        depends_on:
            - db
        env_file:
            - ./.env

    # Nginx Web Server Service
    nginx:
        image: nginx:1.25-alpine
        container_name: symfony_nginx
        restart: unless-stopped
        ports:
            # Expose port 8080 on the host and map it to port 80 in the container
            - "8080:80"
        volumes:
            # Mount the application code (read-only) for Nginx to access the public directory
            - .:/app:ro
            # Mount the custom Nginx configuration
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    # PostgreSQL Database Service
    db:
        image: postgres:16-alpine
        container_name: symfony_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app_user
            POSTGRES_PASSWORD: app_password # Change this in a real project!
        volumes:
            # Persist database data across container restarts
            - db_data:/var/lib/postgresql/data
        ports:
            # Optionally expose the port to the host for tools like DBeaver
            - "5432:5432"

# Define a named volume for data persistence
volumes:
    db_data:
